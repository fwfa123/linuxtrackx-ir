# Example token map for custom skins. The bundled default skin.qss does not
# use these (it uses palette() instead so light/dark themes keep working).
# Copy this folder to ~/.config/linuxtrack/skins/<name>/ and replace @tokens
# in skin.qss when you want a fixed accent palette.
#
# [colors]
# primary_bg = #1e1e2e
# primary_fg = #cdd6f4
# accent     = #89b4fa
# warning    = #f38ba8
# muted      = #a6adc8
