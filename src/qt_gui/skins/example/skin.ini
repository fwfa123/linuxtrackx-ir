# =============================================================================
# EXAMPLE SKIN — Apache / attack-helicopter cockpit palette
# =============================================================================
# NOTES:
# - These keys replace @token in skin.qss before apply.
# - Longer names win over shorter ones (@primary_bg before @primary).
# - Inspired by dark instrument panels, amber HUD cues, and NVG green.
# - Tweak hex values freely; re-Preview in System → Appearance.
# =============================================================================

[colors]
# Deep olive-black airframe / panel base
primary_bg   = #0d120e
panel_bg     = #141c16
input_bg     = #0a0f0b
button_bg    = #1a241c
button_hover = #243028

# Readout / HUD text
primary_fg   = #d7e0c8
muted        = #7a8a6e
accent       = #ffb000
nvg_green    = #39ff14
warning      = #ff5a1f
bezel        = #3a4a38
