# =============================================================================
# EXAMPLE / STARTER SKIN — optional color tokens
# =============================================================================
# NOTES:
# - Keys under [colors] replace @token in skin.qss before the stylesheet loads.
# - Longer names win over shorter ones (@primary_bg before @primary).
# - The example skin.qss mostly uses palette(...) so these are unused until you
#   uncomment the @token lines in skin.qss.
# - Hex values below are a dark "Catppuccin-like" sample — change freely.
# =============================================================================

[colors]
primary_bg = #1e1e2e
primary_fg = #cdd6f4
accent     = #89b4fa
warning    = #f38ba8
muted      = #a6adc8
